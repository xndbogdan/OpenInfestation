[package]
name = "inf-inspect"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Read-only runtime inspector for the original Infestation executable"

[[bin]]
name = "inf-original-inspect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
