[package]
name = "inf-extract"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
description = "Canonical Infestation inventory and asset export CLI"

[dependencies]
inf-formats = { path = "../inf-formats" }
clap = { version = "4", features = ["derive"] }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
