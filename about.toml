# cargo-about configuration for THIRD_PARTY_LICENSES.html in release packages.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
    "Unlicense",
]
targets = ["x86_64-pc-windows-gnu", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = false
