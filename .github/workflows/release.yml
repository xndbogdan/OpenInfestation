name: Release

# Manual only: releases are built locally by scripts/release.ps1, which adds
# Remastered.pak and the upscalers' libraries this workflow cannot. A manual
# run publishes `v<version>` from crates/inf-game's version when that tag
# does not exist yet; a version with a suffix (0.2.0-rc1) is a pre-release.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/inf-game/Cargo.toml | head -n 1)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$tag is already released; bump crates/inf-game's version to publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          # The oldest supported runner keeps the Linux binary's glibc
          # requirement low, so it runs on more distributions.
          - os: ubuntu-22.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # ── Windows: MinGW-w64 GNU toolchain, as for local builds ─────────────
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-make

      - if: runner.os == 'Windows'
        name: Put MinGW-w64 on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ runner.temp }}\msys64\mingw64\bin"

      - if: runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - if: runner.os == 'Windows'
        name: Build (Windows)
        shell: pwsh
        env:
          # MSYS2's GCC 15 defaults to C23, which SDL2's bundled sources reject.
          CFLAGS: -std=gnu17
        run: |
          rustup default stable-x86_64-pc-windows-gnu
          cargo build --release -p inf-game

      # ── Linux: bundled static SDL2 so players need no SDL install ────────
      - if: runner.os == 'Linux'
        name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxinerama-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev

      - if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - if: runner.os == 'Linux'
        name: Build (Linux)
        run: cargo build --release -p inf-game --features sdl2/bundled,sdl2/static-link

      # ── Shared: licenses and packaging ────────────────────────────────────
      - name: Third-party licenses
        shell: bash
        run: |
          # cargo-about 0.9 builds its CLI only with the `cli` feature.
          cargo install cargo-about --locked --version 0.9.2 --features cli
          cargo about generate --fail -o THIRD_PARTY_LICENSES.html about.hbs

      - name: Package
        shell: bash
        run: |
          name="OpenInfestation-${{ needs.version.outputs.tag }}-${{ matrix.platform }}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.html "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/inf-game.exe "$name/OpenInfestation.exe"
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            cp target/release/inf-game "$name/openinfestation"
            chmod +x "$name/openinfestation"
            tar -czf "$name.tar.gz" "$name"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            OpenInfestation-*.zip
            OpenInfestation-*.tar.gz

  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum OpenInfestation-* > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            OpenInfestation-*
            SHA256SUMS.txt
          prerelease: ${{ contains(needs.version.outputs.tag, '-') }}
          generate_release_notes: true
